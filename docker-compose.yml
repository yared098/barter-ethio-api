name: barter

services:
  # ───────────────────────────────────────
  # PostgreSQL
  # ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: barter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: barter
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barter"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - barter-net

  # ───────────────────────────────────────
  # Redis
  # ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: barter-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - barter-net

  # ───────────────────────────────────────
  # API
  # ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barter-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    networks:
      - barter-net

volumes:
  postgres-data:
  redis-data:
  uploads:

networks:
  barter-net:
    driver: bridge
